<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>رحلة إيطاليا 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root{
      --bg-deep:#031018;
      --bg-2:#061B28;
      --bg-card:rgba(7,24,36,.86);
      --bg-card-strong:rgba(8,28,42,.94);
      --gold:#E6C27A;
      --gold-soft:rgba(230,194,122,.16);
      --gold-border:rgba(230,194,122,.28);
      --white:#F8FAFC;
      --muted:#C4D4DF;
      --muted-2:#94A8B8;
      --coral:#E07A5F;
      --coral-soft:rgba(224,122,95,.13);
      --line:rgba(255,255,255,.10);
      --radius-lg:20px;
      --radius-md:14px;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family:'Tajawal',sans-serif;
    }

    html,body{min-height:100%}

    body{
      background:
        radial-gradient(circle at 10% 8%, rgba(36,155,165,.18) 0, transparent 28%),
        radial-gradient(circle at 88% 20%, rgba(230,194,122,.09) 0, transparent 26%),
        radial-gradient(circle at 30% 92%, rgba(25,120,135,.16) 0, transparent 32%),
        linear-gradient(180deg,#031018 0%,#04131D 48%,#020A10 100%);
      background-color:#031018;
      color:var(--white);
      overflow-x:hidden;
      position:relative;
    }

    body::before{
      content:"";
      position:fixed;
      inset:-20%;
      z-index:-1;
      opacity:.24;
      background:
        repeating-radial-gradient(circle at 25% 24%, rgba(230,194,122,.08) 0 1px, transparent 1px 48px),
        repeating-radial-gradient(circle at 72% 62%, rgba(104,196,202,.075) 0 1px, transparent 1px 56px);
      filter:blur(.2px);
      animation:radarDrift 28s ease-in-out infinite alternate;
      pointer-events:none;
    }

    body::after{
      content:"";
      position:fixed;
      width:65vw;
      height:65vw;
      right:-20vw;
      bottom:-20vw;
      border-radius:50%;
      background:radial-gradient(circle,rgba(82,190,195,.11),transparent 66%);
      filter:blur(35px);
      z-index:-1;
      animation:glowFloat 18s ease-in-out infinite alternate;
      pointer-events:none;
    }

    @keyframes radarDrift{
      from{transform:translate3d(0,0,0) scale(1)}
      to{transform:translate3d(20px,-18px,0) scale(1.035)}
    }
    @keyframes glowFloat{
      from{transform:translate3d(0,0,0)}
      to{transform:translate3d(-28px,-20px,0)}
    }

    .app-header{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(3,16,24,.88);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-bottom:1px solid var(--gold-border);
      padding:12px 16px 7px;
    }

    .app-brand{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
    }

    .brand-title{
      font-size:19px;
      font-weight:900;
      color:var(--white);
      letter-spacing:-.2px;
      line-height:1.15;
    }

    .brand-title span{color:var(--gold)}

    .brand-subtitle{
      margin-top:3px;
      font-size:11px;
      color:var(--muted);
      font-weight:600;
    }

    .header-chip{
      width:38px;
      height:38px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--gold-soft);
      border:1px solid var(--gold-border);
      color:var(--gold);
      flex-shrink:0;
    }

    .header-chip svg{width:20px;height:20px}

    .top-nav{
      display:flex;
      gap:9px;
      margin-top:10px;
      overflow-x:auto;
      scrollbar-width:none;
      padding-bottom:8px;
      scroll-behavior:smooth;
    }

    .top-nav::-webkit-scrollbar{display:none}

    .tab{
      border:1px solid var(--line);
      background:rgba(255,255,255,.045);
      color:var(--muted);
      min-width:max-content;
      border-radius:999px;
      padding:8px 14px;
      display:flex;
      align-items:center;
      gap:6px;
      font-size:13px;
      font-weight:800;
      cursor:pointer;
      transition:.25s ease;
    }

    .tab svg{width:15px;height:15px}
